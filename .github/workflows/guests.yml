name: Test guests

on:
  push:
    branches:
      - test-guests

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install llvm lld clang pkgconf cmake flex bison
      - name: Build nxdk
        run: |
          git clone https://github.com/XboxDev/nxdk nxdk
          git -C nxdk checkout fafbe41
          git -C nxdk submodule update --init --recursive
          cd nxdk && eval $(./bin/activate -s) && make NXDK_ONLY=y -j$(nproc)
      - name: Build guests
        run: |
          eval $(nxdk/bin/activate -s)
          mkdir out
          for g in vramcrtc updpaths; do for n in 1 2 3 4; do
            make -C $g -j$(nproc) ONLY_PHASE=$n XBE_TITLE=$g$n && cp $g/$g$n.iso out/ && make -C $g clean >/dev/null
          done; done
          for g in flip250 vramcrtc updpaths; do make -C $g -j$(nproc) && cp $g/$g.iso out/; done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: test-guests
          path: out/*.iso
